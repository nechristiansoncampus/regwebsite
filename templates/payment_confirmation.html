<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration Complete</title>
  <style>
    :root{
      --ink:#24160b;
      --muted:rgba(36,22,11,.64);
      --line:rgba(92,45,11,.16);
      --accent:#b45309;
      --shadow:0 22px 60px rgba(92,45,11,.14);
    }

    *{ box-sizing:border-box; }
    body{
      min-height:100svh;
      margin:0;
      display:grid;
      place-items:center;
      padding:24px;
      color:var(--ink);
      font-family:ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(850px 520px at 20% 10%, rgba(245,158,11,.24), transparent 62%),
        radial-gradient(760px 480px at 90% 90%, rgba(21,128,61,.14), transparent 62%),
        linear-gradient(180deg, #fff7ed, #fef3c7 52%, #ecfdf5);
    }

    .panel{
      width:min(560px, 100%);
      padding:28px;
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(255,253,248,.86);
      box-shadow:var(--shadow);
      text-align:center;
      backdrop-filter:blur(14px);
    }

    h1{
      margin:0 0 10px;
      font-size:clamp(32px, 8vw, 46px);
      line-height:1.05;
      letter-spacing:0;
    }

    p{
      margin:0;
      color:var(--muted);
      font-size:18px;
      line-height:1.6;
    }

    .emailNotice{
      margin-top:14px;
      font-size:15px;
    }

    .homeLink{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:50px;
      margin-top:24px;
      padding:0 22px;
      border:1px solid rgba(180,83,9,.28);
      border-radius:14px;
      background:linear-gradient(90deg, rgba(180,83,9,.18), rgba(245,158,11,.20), rgba(21,128,61,.12));
      color:var(--ink);
      font-weight:800;
      text-decoration:none;
      box-shadow:0 14px 34px rgba(180,83,9,.13);
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>You’re registered</h1>
    <p>See you there, {{ registration.first_name }}!</p>
    <p class="emailNotice">
      You should receive a confirmation email shortly. If you don’t receive it, please contact
      <a href="mailto:nechristiansoncampus@gmail.com">nechristiansoncampus@gmail.com</a>.
    </p>
    <a class="homeLink" href="/">Back to home</a>
  </main>
</body>
</html>
