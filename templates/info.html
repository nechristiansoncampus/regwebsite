<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're Checked In</title>
  <link href="{{ url_for('static', filename='css/check_in.css') }}" rel="stylesheet">
</head>
<body class="checkin-page">
  <main class="checkin-panel">
    <p class="retreat-name">Fall Retreat 2026</p>
    <p class="retreat-theme">But Daniel: A Heart Set for God's Purpose</p>

    <h1 class="checkin-heading">You're checked in!</h1>
    <p class="checkin-intro">Welcome, {{ name }}.</p>

    <div class="assignment-list">
      <div class="assignment-row">
        <span class="assignment-label">Cabin assignment</span>
        <span class="assignment-value">{{ housing }}</span>
      </div>
      <div class="assignment-row">
        <span class="assignment-label">Group</span>
        <span class="assignment-value">{{ group }}</span>
      </div>
    </div>

    <div class="checkin-actions">
      <a class="checkin-link" href="{{ url_for('static', filename='img/camp-map.png') }}">View camp map</a>
      <a class="checkin-link secondary" href="{{ url_for('check_in') }}">Back to check-in</a>
    </div>
    <p class="checkin-note">Please screenshot this page for your records.</p>
  </main>
</body>
</html>
