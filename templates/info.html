<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>You're Checked In | Fall Retreat 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link href="{{ url_for('static', filename='css/style.css') }}" type="text/css" rel="stylesheet">
  </head>
  <body class="info-page">
    <div class="vertical-center"><div class="container-fluid">
      <div class="row justify-content-center align-items-center">
        <div class="col col-sm-6 col-md-6 col-lg-5 col-xl-4 check-in-surface info-surface">
          <p class="retreat-eyebrow">Fall Retreat 2026</p>
          <div class="retreat-wordmark" role="img" aria-label="But Daniel: A Heart Set for God's Purpose">
            <span class="retreat-wordmark-strong retreat-wordmark-first">But Daniel:</span>
            <span class="retreat-wordmark-light">A Heart Set for</span>
            <span class="retreat-wordmark-strong retreat-wordmark-third">God's Purpose</span>
          </div>
          <div class="info-heading"><h1>You're checked in!</h1></div>
          <h4 class="attendee-name">{{name}}</h4>
          <div class="assignment-details">
            <div>Your cabin assignment: {{housing}}</div>
            <div>Your group: {{group}}</div>
          </div>
          <a class="camp-map-link" href="{{ url_for('static', filename='img/camp-map.png') }}">Map of camp</a>
          <div class="info-actions"><a class="btn btn-primary" href="{{ url_for('check_in') }}">Back to Home</a></div>
          <div class="footer">Please screenshot this for your records</div>
        </div>
      </div>
    </div></div>
  </body>
</html>
