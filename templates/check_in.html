<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Fall Retreat 2026 | Check In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" type="text/css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link href="{{ url_for('static', filename='css/style.css') }}" type="text/css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="vertical-center"><div class="container-fluid">
      <div class="row justify-content-center align-items-center">
        <div class="col col-sm-6 col-md-6 col-lg-5 col-xl-4 check-in-surface">
          <p class="retreat-eyebrow">Fall Retreat 2026</p>
          <div class="retreat-wordmark" role="img" aria-label="But Daniel: A Heart Set for God's Purpose">
            <span class="retreat-wordmark-strong retreat-wordmark-first">But Daniel:</span>
            <span class="retreat-wordmark-light">A Heart Set for</span>
            <span class="retreat-wordmark-strong retreat-wordmark-third">God's Purpose</span>
          </div>
          <div class="check-in-intro">
            <h1>Welcome</h1>
            <p>Enter the details used for your registration.</p>
          </div>
          {% if error %}
            <div class="alert alert-danger alert-dismissible fade show check-in-alert" role="alert">
              {{error}}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endif %}
          <div class="check-in-form-area">
            <form class="check-in-form" action="/info" method="post" novalidate>
              <div class="check-in-field">
                <label for="name" class="form-label">Name <span>Optional</span></label>
                <input type="text" class="form-control" name="name" id="name">
              </div>
              <div class="check-in-field">
                <label for="phone" class="form-label">Phone number</label>
                <div class="phone-input-wrap">
                  <input type="tel" class="form-control" name="phone" id="phone" inputmode="numeric" pattern="[0-9]{10}" placeholder="2025550144" aria-describedby="phoneFormat phoneError" required>
                  <div class="field-validation" id="phoneError" role="alert" hidden>
                    <span class="field-validation-icon" aria-hidden="true">!</span>
                    <span class="field-validation-message"></span>
                  </div>
                </div>
                <div id="phoneFormat" class="form-text">numbers only, no dashes or parentheses</div>
              </div>
              <div class="check-in-actions">
                <button type="submit" class="btn btn-primary">Check in</button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <script>
        const checkInForm = document.querySelector('.check-in-form');
        const phoneInput = document.getElementById('phone');
        const phoneError = document.getElementById('phoneError');
        const phoneErrorMessage = phoneError.querySelector('.field-validation-message');

        function hidePhoneError() {
          phoneError.hidden = true;
          phoneInput.classList.remove('is-invalid');
          phoneInput.removeAttribute('aria-invalid');
        }

        function showPhoneError() {
          phoneErrorMessage.textContent = phoneInput.value
            ? 'Enter exactly 10 digits without spaces, dashes, or parentheses.'
            : 'Enter the phone number used for your registration.';
          phoneError.hidden = false;
          phoneInput.classList.add('is-invalid');
          phoneInput.setAttribute('aria-invalid', 'true');
        }

        phoneInput.addEventListener('input', hidePhoneError);
        phoneInput.addEventListener('blur', () => {
          if (phoneInput.value && !phoneInput.validity.valid) showPhoneError();
        });
        checkInForm.addEventListener('submit', (event) => {
          if (!phoneInput.validity.valid) {
            event.preventDefault();
            showPhoneError();
            phoneInput.focus();
          }
        });
      </script>
    </div>
  </body>
</html>
