<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fall Retreat Check-In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <link href="{{ url_for('static', filename='css/check_in.css') }}" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</head>
<body class="checkin-page">
  <main class="checkin-panel">
    <header class="retreat-context">
      <p class="retreat-name">Fall Retreat 2026</p>
      <p class="retreat-theme">But Daniel: A Heart Set for God's Purpose</p>
    </header>

    <h1 class="checkin-heading">Check in</h1>
    <p class="checkin-intro">Enter the phone number used for your registration.</p>

    {% if error %}
      <div class="alert alert-danger alert-dismissible fade show checkin-alert" role="alert">
        {{ error }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endif %}

    <form class="checkin-form" action="/info" method="post">
      <div class="checkin-field">
        <label for="name">Name <span class="optional-label">Optional</span></label>
        <input type="text" class="form-control" name="name" id="name" autocomplete="name">
      </div>
      <div class="checkin-field">
        <label for="phone">Phone number</label>
        <input type="tel" class="form-control" name="phone" id="phone" pattern="^(\+)?(?:[0-9] ?){6,14}[0-9]$" placeholder="2025550144" required>
        <div id="phoneFormat" class="checkin-hint">Numbers only, no dashes or parentheses</div>
      </div>
      <button type="submit" class="checkin-button">Check in</button>
    </form>
  </main>
</body>
</html>
