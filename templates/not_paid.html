<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check-In Assistance</title>
  <link href="{{ url_for('static', filename='css/check_in.css') }}" rel="stylesheet">
</head>
<body class="checkin-page">
  <main class="checkin-panel">
    <p class="retreat-name">Fall Retreat 2026</p>
    <p class="retreat-theme">But Daniel: A Heart Set for God's Purpose</p>

    <h1 class="checkin-heading">Please see registration</h1>
    <p class="notice-text">Hi {{ name }},</p>
    <p class="notice-text">Our records indicate that you have not paid yet. Please go see registration, thank you!</p>

    <div class="checkin-actions">
      <a class="checkin-link secondary" href="{{ url_for('check_in') }}">Back to check-in</a>
    </div>
  </main>
</body>
</html>
